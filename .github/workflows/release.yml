name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish GitHub Release (requires running on a tag ref)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-checks:
    name: Release checks
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.value }}
      should_publish: ${{ steps.publish.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ -z "${version}" ]]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          expected="v${RELEASE_VERSION}"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${expected}" >&2
            exit 1
          fi

      - name: Decide publish mode
        id: publish
        shell: bash
        env:
          REQUESTED_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'false' }}
        run: |
          set -euo pipefail
          should_publish="false"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            should_publish="true"
          elif [[ "${REQUESTED_PUBLISH}" == "true" ]]; then
            if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              echo "workflow_dispatch with publish=true must run on a tag ref." >&2
              exit 1
            fi
            should_publish="true"
          fi

          echo "value=${should_publish}" >> "$GITHUB_OUTPUT"

      - name: Verify release tag and main history
        if: steps.publish.outputs.value == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: bash scripts/release/verify_tag.sh "$GITHUB_REF" "$RELEASE_VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Validate release and E2E scripts
        run: |
          bash -n scripts/e2e/common.sh scripts/e2e/bootstrap.sh scripts/e2e/down.sh
          python3 -m unittest discover -s scripts/e2e -p 'test_*.py'
          python3 -m unittest discover -s scripts/release -p 'test_*.py'

  release-e2e:
    name: Release GitBucket ${{ matrix.version }} acceptance
    needs: release-checks
    strategy:
      fail-fast: false
      matrix:
        version: ['4.44.0', '4.48.0']
    permissions:
      contents: read
    uses: ./.github/workflows/contract-e2e.yml
    with:
      version: ${{ matrix.version }}

  release-msrv:
    name: Release Rust 1.88.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88.0
      - run: cargo build --locked
      - run: cargo check --locked --all-targets --all-features

  build-release-assets:
    name: Package ${{ matrix.target }}
    needs:
      - release-checks
      - release-e2e
      - release-msrv
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
            binary_name: gitbucket-mcp-server
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
            binary_name: gitbucket-mcp-server
          - os: macos-15
            target: aarch64-apple-darwin
            archive_ext: tar.gz
            binary_name: gitbucket-mcp-server
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            binary_name: gitbucket-mcp-server.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-checks.outputs.version }}"
          archive_base="gitbucket-mcp-server-${version}-${{ matrix.target }}"
          archive_dir="dist/${archive_base}"
          mkdir -p "${archive_dir}/skills"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${archive_dir}/gitbucket-mcp-server"
          cp README.md LICENSE RELEASE.md TESTING.md VERIFICATION.md "${archive_dir}/"
          cp -r docs "${archive_dir}/"
          cp -r skills/gitbucket-mcp "${archive_dir}/skills/"
          tar -C dist -czf "dist/${archive_base}.${{ matrix.archive_ext }}" "${archive_base}"
          (
            cd dist
            shasum -a 256 "${archive_base}.${{ matrix.archive_ext }}" > "${archive_base}.${{ matrix.archive_ext }}.sha256"
          )

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.release-checks.outputs.version }}"
          $archiveBase = "gitbucket-mcp-server-$version-${{ matrix.target }}"
          $archiveDir = Join-Path "dist" $archiveBase
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" (Join-Path $archiveDir "gitbucket-mcp-server.exe")
          Copy-Item README.md, LICENSE, RELEASE.md, TESTING.md, VERIFICATION.md $archiveDir
          Copy-Item -Recurse docs $archiveDir
          $skillDir = Join-Path $archiveDir "skills"
          New-Item -ItemType Directory -Force -Path $skillDir | Out-Null
          Copy-Item -Recurse skills/gitbucket-mcp $skillDir
          Push-Location "dist"
          try {
            Compress-Archive -Path $archiveBase -DestinationPath "$archiveBase.${{ matrix.archive_ext }}" -Force
          }
          finally {
            Pop-Location
          }
          $hash = (Get-FileHash "dist/$archiveBase.${{ matrix.archive_ext }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archiveBase.${{ matrix.archive_ext }}" | Set-Content "dist/$archiveBase.${{ matrix.archive_ext }}.sha256"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.${{ matrix.archive_ext }}
            dist/*.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: needs.release-checks.outputs.should_publish == 'true'
    needs:
      - release-checks
      - release-e2e
      - release-msrv
      - build-release-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Checkout the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: release-source

      - name: Check release tag before staging
        id: staging
        working-directory: release-source
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-checks.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release/verify_tag.sh "$GITHUB_REF" "$RELEASE_VERSION"
          published_tags=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')
          if grep -Fxq -- "$GITHUB_REF_NAME" <<< "$published_tags"; then
            echo "The release for $GITHUB_REF_NAME is already published."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            commit=$(git rev-parse --verify HEAD)
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "commit=$commit" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to a draft GitHub Release
        if: steps.staging.outputs.needed == 'true'
        id: draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ steps.staging.outputs.commit }}
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.release-checks.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256

      - name: Recheck the tag and publish the draft
        if: steps.staging.outputs.needed == 'true'
        working-directory: release-source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release-checks.outputs.version }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: bash scripts/release/publish_draft.sh "$GITHUB_REF" "$RELEASE_VERSION" "$RELEASE_ID"
