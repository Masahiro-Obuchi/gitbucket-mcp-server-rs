name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read

jobs:
  docker-e2e:
    name: GitBucket ${{ matrix.version }} acceptance
    strategy:
      fail-fast: false
      matrix:
        version: ['4.44.0', '4.48.0']
    uses: ./.github/workflows/contract-e2e.yml
    with:
      version: ${{ matrix.version }}
