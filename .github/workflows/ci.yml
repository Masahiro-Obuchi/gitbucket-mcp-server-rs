name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate E2E scripts
        run: |
          bash -n scripts/e2e/common.sh scripts/e2e/bootstrap.sh scripts/e2e/down.sh
          python3 -m unittest discover -s scripts/e2e -p 'test_*.py'

      - name: Run tests
        run: cargo test --locked

  msrv:
    name: Rust 1.88.0 (locked)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install minimum Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.88.0
      - name: Build with the declared minimum Rust version
        run: cargo build --locked
      - name: Check all targets on the minimum Rust version
        run: cargo check --locked --all-targets --all-features
